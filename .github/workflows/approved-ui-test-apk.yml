name: Build isolated English Words test APK
on:
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Compile and publish TEST-ONLY APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate integrated Android sources
        run: python3 scripts/validate_integration.py
      - name: Prepare offline models
        run: |
          if [ -f scripts/prepare_vosk_models.py ]; then
            python3 scripts/prepare_vosk_models.py
          fi
      - name: Run tests and compile isolated APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify voice assets
        run: |
          if [ -f scripts/verify_vosk_apk.py ]; then
            python3 scripts/verify_vosk_apk.py
          fi
      - name: Verify APK identity and SHA256
        run: |
          set -e
          mkdir -p results
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -1)
          test -n "$APK"
          sha256sum "$APK" | tee results/preview-sha256.txt
          echo "source_sha=$GITHUB_SHA" > results/preview-build.txt
          echo "package=com.example.english1000.approvedui217preview" >> results/preview-build.txt
          echo "RELEASE_ACCEPTANCE=BLOCKED: 217-photo mapping/integrity gate not yet PASS" >> results/preview-build.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EnglishWords-ApprovedUI-TEST-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: EnglishWords-ApprovedUI-TEST-SHA256
          path: |
            results/preview-sha256.txt
            results/preview-build.txt
          if-no-files-found: error
