name: Image Factory Python tests

on:
  push:
    branches:
      - feature/local-image-factory
    paths:
      - 'tools/image_factory/**'
      - '.github/workflows/image-factory-tests.yml'
  pull_request:
    paths:
      - 'tools/image_factory/**'
      - '.github/workflows/image-factory-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-factory-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }} unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Compile Python modules
        run: python -m compileall -q tools/image_factory
      - name: Run isolated unit tests
        run: python -m unittest discover -s tools/image_factory -p 'test_*.py' -v
