
name: Build Android APK

on:
  push:
    branches: [main, 'integrate/**', 'develop/**', 'design/**', 'beta/**', 'release/**']
  workflow_dispatch:

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify local content and integrated activities
        run: python3 scripts/validate_integration.py

      - name: Bundle offline speech models when supported by branch
        run: |
          if [ -f scripts/prepare_vosk_models.py ]; then
            python3 scripts/prepare_vosk_models.py
          fi

      - name: Verify 217 photo file gate for November release
        id: release_assets
        if: startsWith(github.ref, 'refs/heads/release/')
        continue-on-error: true
        run: python3 scripts/check_release_217_assets.py

      - name: Upload release asset audit
        if: always() && startsWith(github.ref, 'refs/heads/release/')
        uses: actions/upload-artifact@v4
        with:
          name: EnglishWords-217-Release-Asset-Audit
          path: results/release-217-audit.json
          if-no-files-found: warn

      - name: Run unit tests and build APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify offline models and native libraries are in APK
        if: hashFiles('scripts/verify_vosk_apk.py') != ''
        run: python3 scripts/verify_vosk_apk.py

      - name: Generate APK provenance and SHA-256
        if: success()
        run: |
          mkdir -p results
          sha256sum app/build/outputs/apk/debug/*.apk | tee results/apk-sha256.txt
          echo "Source commit: ${GITHUB_SHA}" > results/apk-provenance.txt
          echo "Asset gate outcome: ${{ steps.release_assets.outcome }}" >> results/apk-provenance.txt
          echo "This is a test APK, not approved for the 217-photo release unless asset gate PASS." >> results/apk-provenance.txt

      - name: Upload build provenance
        if: always() && startsWith(github.ref, 'refs/heads/release/')
        uses: actions/upload-artifact@v4
        with:
          name: EnglishWords-Release-Provenance
          path: |
            results/apk-sha256.txt
            results/apk-provenance.txt
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnglishWords-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Enforce 217-photo release gate after preview APK upload
        if: always() && startsWith(github.ref, 'refs/heads/release/') && steps.release_assets.outcome == 'failure'
        run: |
          echo "::error::217-photo asset gate failed. Any uploaded APK is TEST-ONLY and NOT a complete release. See EnglishWords-217-Release-Asset-Audit."
          exit 1
