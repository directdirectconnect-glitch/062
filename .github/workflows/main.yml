name: Build Android APK
on:
  push:
    branches: [main, 'integrate/**', 'develop/**', 'design/**', 'beta/**', 'release/**']
  workflow_dispatch:
concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify integrated Android source
        run: python3 scripts/validate_integration.py
      - name: Restore SHA-256-locked 217 WebP source bundle
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: bash
        run: |
          set -euo pipefail
          cat release-media/webp-217-parts/part-*.bin > /tmp/english-words-217-webp.zip
          echo "19030d89a8f0cfee844be04f67bab3ce7b7d76f641358ef71941269249eb3c72  /tmp/english-words-217-webp.zip" | sha256sum -c -
          unzip -tq /tmp/english-words-217-webp.zip
          rm -rf app/src/main/assets/images app/src/main/assets/additional_photos
          unzip -oq /tmp/english-words-217-webp.zip
          test "$(find app/src/main/assets/images -type f -name '*.webp' | wc -l)" -eq 164
          test "$(find app/src/main/assets/additional_photos -type f -name '*.webp' | wc -l)" -eq 53
      - name: Prepare offline speech models
        run: |
          if [ -f scripts/prepare_vosk_models.py ]; then
            python3 scripts/prepare_vosk_models.py
          fi
      - name: Install WebP decoding validator
        if: startsWith(github.ref, 'refs/heads/release/')
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify all 217 WebP images and dictionary mappings
        id: release_assets
        if: startsWith(github.ref, 'refs/heads/release/')
        run: python3 scripts/check_release_217_assets.py
      - name: Upload release asset audit
        if: always() && startsWith(github.ref, 'refs/heads/release/')
        uses: actions/upload-artifact@v4
        with:
          name: EnglishWords-217-Release-Asset-Audit
          path: results/release-217-audit.json
          if-no-files-found: warn
      - name: Import 50 approved November WebP images into dictionary
        if: startsWith(github.ref, 'refs/heads/release/')
        run: python3 scripts/import_50_webp_267.py
      - name: Upload 267-photo image audit
        if: always() && startsWith(github.ref, 'refs/heads/release/')
        uses: actions/upload-artifact@v4
        with:
          name: EnglishWords-267-Release-Asset-Audit
          path: results/267-webp-audit.json
          if-no-files-found: warn
      - name: Run unit tests and assemble APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify offline voice models and native libraries
        if: hashFiles('scripts/verify_vosk_apk.py') != ''
        run: python3 scripts/verify_vosk_apk.py
      - name: Verify compiled APK contains exactly 267 WebP
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          unzip -Z1 "$APK" | grep -E '^assets/(images|additional_photos)/.*\.(webp|png|jpg|jpeg)$' > results/apk-image-inventory.txt
          test "$(wc -l < results/apk-image-inventory.txt)" -eq 267
          test "$(grep -c '\.webp
          echo "PASS: 267 WebP in APK; 0 PNG/JPEG in the vocabulary media asset paths" > results/apk-image-proof.txt
          sha256sum "$APK" >> results/apk-image-proof.txt
      - name: Record APK SHA-256 and provenance
        run: |
          mkdir -p results
          sha256sum app/build/outputs/apk/debug/*.apk | tee results/apk-sha256.txt
          echo "Commit: ${GITHUB_SHA}" > results/apk-provenance.txt
          echo "App integration and release image gate completed; physical S20 FE installation is separately required." >> results/apk-provenance.txt
      - name: Upload build provenance
        if: always() && startsWith(github.ref, 'refs/heads/release/')
        uses: actions/upload-artifact@v4
        with:
          name: EnglishWords-Release-Provenance
          path: |
            results/apk-sha256.txt
            results/apk-provenance.txt
            results/apk-image-inventory.txt
            results/apk-image-proof.txt
            results/267-webp-audit.json
          if-no-files-found: warn
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnglishWords-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
