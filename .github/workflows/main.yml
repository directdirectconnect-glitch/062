
name: Build Android APK

on:
  push:
    branches: [main, 'integrate/**', 'develop/**', 'design/**', 'beta/**', 'release/**']
  workflow_dispatch:

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify local content and integrated activities
        run: python3 scripts/validate_integration.py

      - name: Report bundled dictionary and visual content
        run: python3 scripts/build_content_report.py

      - name: Bundle offline speech models when supported by branch
        run: |
          if [ -f scripts/prepare_vosk_models.py ]; then
            python3 scripts/prepare_vosk_models.py
          fi

      - name: Run unit tests and build APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify offline models and native libraries are in APK
        if: hashFiles('scripts/verify_vosk_apk.py') != ''
        run: python3 scripts/verify_vosk_apk.py

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnglishWords-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            build/apk-content-report.txt
          if-no-files-found: error
          retention-days: 14
