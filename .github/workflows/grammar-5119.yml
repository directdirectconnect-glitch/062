name: Build 5,119 English Words grammar labels
on:
  workflow_dispatch:
  push:
    branches: ['develop/lexical-pos-5119']
    paths:
      - 'scripts/classify_grammar_5119.py'
      - 'app/src/main/assets/words.json'
      - 'app/src/main/assets/word_families.json'
      - '.github/workflows/grammar-5119.yml'
permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lexical dictionary
        run: |
          python -m pip install --disable-pip-version-check 'nltk==3.9.1'
          python -m nltk.downloader wordnet omw-1.4
      - name: Generate index and inspect POS quality
        run: |
          python scripts/classify_grammar_5119.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("app/src/main/assets/word_grammar_5119.json").read_text(encoding="utf-8"))
          r=json.loads(Path("reports/word_grammar_5119_report.json").read_text(encoding="utf-8"))
          assert len(p["entries"])==r["total"]==5119
          assert len({x["wordId"] for x in p["entries"]})==5119
          for idx,x in enumerate(p["entries"],1):
              assert x["wordId"]==idx
              assert x["possibleSentenceRoles"]["requiresSentenceContext"] is True
              if len(x["possiblePartsOfSpeech"])!=1:
                  assert x["primaryPartOfSpeech"] is None
          assert "noun" in p["entries"][266]["possiblePartsOfSpeech"] # book, ID 267
          assert "determiner" in p["entries"][0]["possiblePartsOfSpeech"] # the, ID 1
          assert "verb" in p["entries"][6]["possiblePartsOfSpeech"] # is, ID 7
          assert r["nounCandidates"]>=500
          print("PASS: complete 5119 entries, noun/verb/function word and role rules")
          PY
      - name: Commit generated classified dictionary and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/word_grammar_5119.json reports/word_grammar_5119_report.json
          if ! git diff --cached --quiet; then
            git commit -m "data(grammar): generate 5119 lexical POS candidate annotations"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: EnglishWords-5119-POS-annotations
          path: |
            app/src/main/assets/word_grammar_5119.json
            reports/word_grammar_5119_report.json
