name: Build English Words 1.0.24
on:
  workflow_dispatch:
  push:
    branches: ["build/englishwords-1.0.24", "fix/englishwords-1.0.24-startup-lite"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Android SDK is preinstalled on GitHub ubuntu-latest runners.
      # Avoid setup-android@v3: its legacy `sdkmanager tools` package is unavailable.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install openpyxl
      - name: Confirm emergency build excludes bundled neural voice models
        run: test ! -d app/src/main/assets/tts || ! find app/src/main/assets/tts -name "*.onnx" | grep -q .
      - name: Test and build APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk && sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EnglishWords-1.0.24-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish verified CI APK as GitHub prerelease
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" EnglishWords-1.0.24-startup-lite-debug.apk
          sha256sum EnglishWords-1.0.24-startup-lite-debug.apk > EnglishWords-1.0.24-SHA256.txt
          TAG="englishwords-1.0.24-lite-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" EnglishWords-1.0.24-startup-lite-debug.apk EnglishWords-1.0.24-SHA256.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "English Words 1.0.24 — emergency startup-lite QA APK" \
            --prerelease --notes "CI-built debug APK for device testing. NOT a production-signed release. Emergency diagnostic APK without bundled neural TTS models. Offline neural voice temporarily disabled. Startup on Samsung S20 FE remains NOT_RUN. Build source: $GITHUB_SHA"
