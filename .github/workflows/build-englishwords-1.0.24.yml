name: Build English Words 1.0.24
on:
  workflow_dispatch:
  push:
    branches: ["build/englishwords-1.0.24"]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Android SDK is preinstalled on GitHub ubuntu-latest runners.
      # Avoid setup-android@v3: its legacy `sdkmanager tools` package is unavailable.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install openpyxl
      - name: Audit bundled offline TTS assets (EN/RU)
        continue-on-error: true # diagnostic until licensed models are actually bundled
        run: python scripts/verify_offline_tts_assets.py
      - name: Test and build APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk && sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EnglishWords-1.0.24-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
