name: Vocabulary 5000 Source Dictionary Quality Gate

on:
  push:
    branches: ['develop/vocabulary-5000-stage1']
    paths:
      - 'app/src/main/assets/words.json'
      - 'scripts/audit_vocabulary.py'
      - '.github/workflows/vocabulary-5000.yml'
  pull_request:
    paths:
      - 'app/src/main/assets/words.json'
      - 'scripts/audit_vocabulary.py'
  workflow_dispatch:

jobs:
  audit-source-vocabulary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit actual app vocabulary only
        run: python3 scripts/audit_vocabulary.py --require-5000-single-words --output build/vocabulary-audit.json
      - name: Publish source dictionary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-vocabulary-audit
          path: build/vocabulary-audit.json
          if-no-files-found: warn
