name: Select strict single-POS noun candidates
on:
  workflow_dispatch:
  push:
    branches: ['develop/lexical-pos-5119']
    paths:
      - 'scripts/select_noun_candidates.py'
      - 'app/src/main/assets/word_grammar_5119.json'
      - 'app/src/main/assets/words.json'
      - '.github/workflows/noun-candidates-5119.yml'
permissions:
  contents: write
jobs:
  noun-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate strict noun-only lexical candidates; no image approval
        run: |
          python scripts/select_noun_candidates.py
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("app/src/main/assets/noun_candidates_5119.json").read_text(encoding="utf-8"))
          r=json.loads(Path("reports/noun_candidates_5119_report.json").read_text(encoding="utf-8"))
          assert x["candidateCount"]==r["nounCandidates"]
          assert r["approvedForImages"]==0
          assert r["nounCandidates"]+r["excludedFromNounQueue"]==5119
          assert r["excludedMultiPosNouns"]==2032
          assert 0<r["nounCandidates"]<=1749
          assert len({e["wordId"] for e in x["candidates"]})==r["nounCandidates"]
          assert all(e["partOfSpeech"]=="noun" and not e["otherPossiblePartsOfSpeech"] and
                     not e["senseNeedsReview"] and e["imageStatus"]=="NOT_APPROVED"
                     for e in x["candidates"])
          print("PASS strict noun-only review queue:",r["nounCandidates"],"candidates, 0 automatic image approvals")
          PY
      - name: Save generated noun-only index and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/noun_candidates_5119.json reports/noun_candidates_5119_report.json
          if ! git diff --cached --quiet; then
            git commit -m "data(nouns): exclude ambiguous and non-noun entries"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: EnglishWords-strict-noun-candidates
          path: |
            app/src/main/assets/noun_candidates_5119.json
            reports/noun_candidates_5119_report.json
