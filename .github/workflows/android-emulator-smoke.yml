name: Android emulator startup crash regression
on:
  workflow_dispatch:
  push:
    branches: ["build/englishwords-1.0.24", "fix/englishwords-1.0.24-lazy-voice", "fix/englishwords-1.0.24-voice-lifecycle"]
    paths:
      - "app/**"
      - "scripts/**"
      - ".github/workflows/android-emulator-smoke.yml"
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install openpyxl
      - run: python scripts/install_sherpa_tts_models.py
      - name: Build x86_64 emulator APK
        run: gradle --no-daemon -PenglishWordsAbi=x86_64 :app:assembleDebug
      - name: Boot emulator, launch and monitor for 20 seconds
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-boot-timeout: 600
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.example.english1000.offlinevoskqa/com.example.english1000.MainActivity
            sleep 5
            adb shell uiautomator dump /sdcard/englishwords-ui.xml
            adb shell cat /sdcard/englishwords-ui.xml > emulator-home-ui.xml
            python3 - <<'PY'
            import re, subprocess, xml.etree.ElementTree as ET
            root = ET.parse("emulator-home-ui.xml").getroot()
            nodes = [(e.attrib.get("text", ""), e.attrib.get("bounds", "")) for e in root.iter("node")]
            target = next(((text, bounds) for text, bounds in nodes if
                           "Учить слова" in text or "Изучение слов" in text or "Learn Words" in text), None)
            if target is None:
                print("HOME_NODES:", nodes)
                raise SystemExit("FAIL: Learn Words button not found")
            coords = [int(v) for v in re.findall("[0-9]+", target[1])]
            subprocess.run(["adb", "shell", "input", "tap", str((coords[0]+coords[2])//2),
                            str((coords[1]+coords[3])//2)], check=True)
            print("LEARN_BUTTON_TAPPED:", target[0])
            PY
            sleep 30
            adb logcat -d -v time > emulator-full.log
            grep "EnglishWordsVoice" emulator-full.log || true
            adb shell pidof com.example.english1000.offlinevoskqa || { echo "FAIL: APP_DIED_AFTER_LEARN"; exit 1; }
            adb logcat -d -b crash > emulator-crash.log
            if grep -E 'FATAL EXCEPTION|Fatal signal|SIGSEGV|SIGABRT' emulator-crash.log; then
              cat emulator-crash.log
              exit 1
            fi
            echo "EMULATOR_LEARN_SCREEN_30_SECONDS: PASS"
      - name: Upload crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-crash-log
          path: |
            emulator-crash.log
            emulator-full.log
            emulator-home-ui.xml
          if-no-files-found: ignore
