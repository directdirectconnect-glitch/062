name: Android emulator startup crash regression
on:
  workflow_dispatch:
  push:
    branches: ["build/englishwords-1.0.24"]
    paths:
      - "app/**"
      - "scripts/**"
      - ".github/workflows/android-emulator-smoke.yml"
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install openpyxl
      - run: python scripts/install_sherpa_tts_models.py
      - name: Build x86_64 emulator APK
        run: gradle --no-daemon -PenglishWordsAbi=x86_64 :app:assembleDebug
      # Linux hosted runners need explicit access to /dev/kvm for accelerated x86_64 emulation.
      # Fail early with a clear infrastructure error instead of waiting 600s for adb.
      - name: Enable KVM for Android emulator
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM_DEVICE_MISSING: /dev/kvm is unavailable on this runner; emulator cold-start test NOT_RUN"
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Boot emulator, launch and monitor for 20 seconds
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-boot-timeout: 600
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.example.english1000.offlinevoskqa/com.example.english1000.MainActivity
            sleep 20
            adb shell pidof com.example.english1000.offlinevoskqa
            adb logcat -d -b crash > emulator-crash.log
            if grep -E 'FATAL EXCEPTION|Fatal signal|SIGSEGV|SIGABRT' emulator-crash.log; then
              cat emulator-crash.log
              exit 1
            fi
            echo "EMULATOR_COLD_START_20_SECONDS: PASS"
      - name: Upload crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-crash-log
          path: emulator-crash.log
          if-no-files-found: ignore
