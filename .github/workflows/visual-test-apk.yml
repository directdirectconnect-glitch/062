name: English Words 5121 + 118 images visual test APK
on:
  workflow_dispatch:
  push:
    branches:
      - test/0.9.8-5119-118-images-s20fe-fold
    paths:
      - integration/EnglishWords_118_images_APK_integration.zip
jobs:
  build-visual-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install audited visual package (fail if missing)
        run: python3 scripts/install_visual_package.py --archive integration/EnglishWords_118_images_APK_integration.zip --expected-images 118
      - name: Validate 5121-word integration
        run: python3 scripts/validate_integration.py
      - name: Bundle offline speech models
        run: python3 scripts/prepare_vosk_models.py
      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify Vosk package
        run: python3 scripts/verify_vosk_apk.py
      - name: Upload visual test APK
        uses: actions/upload-artifact@v4
        with:
          name: EnglishWords-5121-118-Visual-Test-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
