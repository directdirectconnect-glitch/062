name: English Words 5126 + 164 images visual test APK
on:
  workflow_dispatch:
  push:
    branches:
      - test/0.9.8-5119-118-images-s20fe-fold
    paths:
      - app/**
      - build-requests/visual-164-drive-mapping.json
      - scripts/verify_visual_assets.py
      - .github/workflows/visual-test-apk.yml
jobs:
  build-visual-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify visual assets and dictionary
        run: |
          python -m pip install Pillow==12.1.1
          python scripts/verify_visual_assets.py
          python scripts/validate_integration.py
      - name: Bundle offline speech models
        run: python scripts/prepare_vosk_models.py
      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK
        run: |
          python scripts/verify_vosk_apk.py
          apk="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | sed -n '1p'
          sha256sum "$apk"
      - name: Upload visual test APK
        uses: actions/upload-artifact@v4
        with:
          name: EnglishWords-5126-164-Visual-Test-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
