name: S20 QA 0.9.8 5119 Voice Isolated APK

on:
  push:
    branches: ['develop/0.9.8-5119-voice-qa']
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/s20qa-android.yml'
  workflow_dispatch:

concurrency:
  group: s20qa-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-build-and-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENGLISHWORDS_TEST_PACKAGE: com.example.english1000.s20qa
      ENGLISHWORDS_TEST_APK: app/build/outputs/apk/s20qa/app-s20qa.apk
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify source assets and 5119-word vocabulary
        run: |
          python3 scripts/audit_vocabulary.py --require-5000-single-words
          python3 scripts/validate_integration.py
      - name: Bundle pinned offline Vosk models
        run: python3 scripts/prepare_vosk_models.py
      - name: Run JVM tests and build only the isolated test variant
        run: gradle --no-daemon :app:testS20qaUnitTest :app:assembleS20qa
      - name: Verify EN and RU models inside isolated APK
        run: python3 scripts/verify_vosk_apk.py
      - name: Verify distinct package identifier in APK
        run: |
          test -f "$ENGLISHWORDS_TEST_APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -n 1)"
          "$AAPT" dump badging "$ENGLISHWORDS_TEST_APK" | head -1 | tee /tmp/s20qa-package.txt
          grep -q "package: name='com.example.english1000.s20qa'" /tmp/s20qa-package.txt
          sha256sum "$ENGLISHWORDS_TEST_APK"
      - name: Enable emulator KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android 13 offline UI regression (isolated QA package)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: aosp_atd
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 scripts/smoke_apk_emulator.py
      - name: Collect regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EnglishWords-S20QA-5119-Emulator-Report
          path: build/emulator-smoke/
          if-no-files-found: warn
      - name: Publish isolated QA APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EnglishWords-S20QA-5119-Voice-APK
          path: app/build/outputs/apk/s20qa/*.apk
          if-no-files-found: error
